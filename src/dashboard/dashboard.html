<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research-Noted-Gmgn — Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="side-head">
        <div class="brand">
          <h1>📝 Research-Noted-Gmgn <span class="sub">Dashboard</span></h1>
          <div class="stats" id="stats"></div>
        </div>
        <input id="search" type="search" data-i18n-ph="search_ph" autocomplete="off">
        <div class="filters">
          <select id="f-status"><option value="" data-i18n="all_statuses"></option></select>
          <select id="f-sort">
            <option value="updated" data-i18n="sort_updated"></option>
            <option value="created" data-i18n="sort_created"></option>
            <option value="symbol" data-i18n="sort_symbol"></option>
            <option value="rating" data-i18n="sort_rating"></option>
            <option value="entries" data-i18n="sort_entries"></option>
          </select>
          <label class="chk"><input type="checkbox" id="f-pinned"> <span data-i18n="pinned_only"></span></label>
        </div>
        <div class="tagbar" id="tagbar"></div>
      </header>
      <ul class="list" id="list"></ul>
      <footer class="side-foot">
        <button id="add-url" class="primary" data-i18n="add_url"></button>
        <button id="export-json" data-i18n="export_json_short"></button>
        <button id="export-md" data-i18n="export_md"></button>
        <button id="import-json" data-i18n="import_json"></button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
        <button id="open-settings">⚙ <span data-i18n="settings"></span></button>
      </footer>
    </aside>
    <main class="main">
      <div class="empty" id="empty">
        <div class="empty-icon">📝</div>
        <p data-i18n-html="dash_empty_1"></p>
        <p class="muted" data-i18n-html="dash_empty_2"></p>
      </div>
      <div id="editor-mount" class="editor-mount" hidden></div>
    </main>
  </div>
  <div class="modal" id="settings" hidden>
    <div class="modal-box">
      <div class="modal-head"><b>⚙ <span data-i18n="settings"></span></b><button class="ghost" id="settings-close" data-i18n-title="close_plain">×</button></div>
      <label class="field"><span data-i18n="language"></span><select id="lang"></select></label>
      <label class="field"><span data-i18n="ui_mode"></span>
        <select id="ui-mode"><option value="panel" data-i18n="ui_panel"></option><option value="drawer" data-i18n="ui_drawer"></option></select>
      </label>
      <label class="field chk-row"><input type="checkbox" id="list-badges"> <span data-i18n="list_badges_setting"></span></label>
      <label class="field chk-row"><input type="checkbox" id="follow"> <span data-i18n="follow_page"></span></label>
      <label class="field chk-row"><input type="checkbox" id="grok-auto"> <span data-i18n="grok_auto_setting"></span></label>
      <label class="field chk-row"><input type="checkbox" id="export-images"> <span data-i18n="export_images"></span></label>
      <label class="field"><span data-i18n="research_target"></span><select id="research-target"></select></label>
      <label class="field"><span data-i18n="research_template"></span>
        <textarea id="research-template" rows="9" spellcheck="false"></textarea>
        <small class="muted" data-i18n="template_help"></small>
      </label>
      <div class="modal-foot"><button id="template-reset" data-i18n="reset_default"></button><span class="muted" id="settings-saved"></span></div>
    </div>
  </div>
  <script src="../lib/storage.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/research.js"></script>
  <script src="../lib/editor.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
