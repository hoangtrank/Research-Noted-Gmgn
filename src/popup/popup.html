<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Research-Noted-Gmgn</title>
  <style>
    body{margin:0;width:260px;background:#111318;color:#e6e8ec;font:var(--ne-fs,14px)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .wrap{padding:12px}
    h1{margin:0 0 2px;font-size:calc(var(--ne-fs,14px) + 2px)}
    .stats{color:#9aa3b2;font-size:calc(var(--ne-fs,14px) - 2px);margin-bottom:10px}
    button{display:block;width:100%;margin-top:6px;font:inherit;cursor:pointer;border:1px solid #2b303a;background:#181b22;color:#e6e8ec;border-radius:8px;padding:8px 10px;text-align:left}
    button:hover{background:#20242d}
    button.primary{background:#facc15;border-color:#facc15;color:#111;font-weight:600}
    button.primary:hover{background:#fde047}
    [hidden]{display:none!important}
    .hint{margin-top:10px;color:#6b7280;font-size:calc(var(--ne-fs,14px) - 2px)}
    .setting{display:block;margin-top:10px;font-size:calc(var(--ne-fs,14px) - 2px);color:#9aa3b2}
    select{display:block;width:100%;margin-top:4px;font:inherit;color:#e6e8ec;background:#181b22;border:1px solid #2b303a;border-radius:8px;padding:6px 8px}
    .gmgn-new a{color:#60a5fa;text-decoration:none}.gmgn-new a:hover{text-decoration:underline}
    .gmgn-new .ref{color:#6b7280;font-size:11px;border:1px solid #2b303a;border-radius:999px;padding:0 6px;margin-left:2px;white-space:nowrap}
    kbd{font:10px ui-monospace,Menlo,monospace;background:#181b22;border:1px solid #2b303a;border-bottom-width:2px;border-radius:4px;padding:0 4px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📝 Research-Noted-Gmgn</h1>
    <div class="stats" id="stats">…</div>
    <button id="note-this" class="primary" hidden data-i18n="note_this"></button>
    <button id="open-dash" data-i18n="open_dashboard"></button>
    <button id="export" data-i18n="export_json"></button>
    <label class="setting"><span data-i18n="ui_mode"></span>
      <select id="ui-mode">
        <option value="panel" data-i18n="ui_panel"></option>
        <option value="drawer" data-i18n="ui_drawer"></option>
      </select>
    </label>
    <label class="setting"><span data-i18n="language"></span>
      <select id="lang"></select>
    </label>
    <div class="hint" data-i18n="popup_hint"></div>
    <div class="hint gmgn-new"><a data-gmgn-invite data-i18n="gmgn_new"></a> <span class="ref" data-i18n="gmgn_ref"></span></div>
  </div>
  <script src="../lib/storage.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
